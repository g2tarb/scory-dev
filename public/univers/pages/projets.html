<section class="char-select" id="char-select">
  <a href="/" data-route="/" class="char-select__back" aria-label="Retour au hub">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
    <span>Hub</span>
  </a>

  <header class="char-select__header">
    <span class="char-select__kicker">Projets clients</span>
    <h1 class="char-select__heading">Selection du projet</h1>
    <span class="char-select__counter" id="cs-counter">01 / 06</span>
  </header>

  <div class="char-select__main">
    <!-- Portrait géant gauche -->
    <div class="char-select__portrait-zone">
      <div class="char-select__portrait" id="cs-portrait">
        <span class="char-select__portrait-glyph" id="cs-portrait-glyph">S</span>
        <img class="char-select__portrait-img" id="cs-portrait-img" alt="" />
        <div class="char-select__portrait-scan" aria-hidden="true"></div>
      </div>
      <h2 class="char-select__name" id="cs-name">—</h2>
      <p class="char-select__role" id="cs-role">—</p>
    </div>

    <!-- Fiche stats droite -->
    <aside class="char-select__sheet">
      <div class="char-select__stat">
        <span class="char-select__stat-label">Probleme regle</span>
        <p class="char-select__problem" id="cs-problem">—</p>
      </div>
      <div class="char-select__stat">
        <span class="char-select__stat-label">Stack</span>
        <div class="char-select__stack" id="cs-stack"></div>
      </div>
      <div class="char-select__stat char-select__stat--row">
        <span class="char-select__stat-label">Temps de realisation</span>
        <span class="char-select__duration" id="cs-duration">—</span>
      </div>
      <a class="char-select__cta" id="cs-cta" href="#" target="_blank" rel="noopener noreferrer">
        <span>Voir le projet</span>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17L17 7"/><path d="M7 7h10v10"/></svg>
      </a>
    </aside>
  </div>

  <!-- Roster en bas : les cases de personnages -->
  <nav class="char-select__roster" id="cs-roster" aria-label="Choisir un projet"></nav>

  <p class="char-select__hint" aria-hidden="true">
    <span class="kbd">←</span><span class="kbd">→</span> naviguer
    <span class="kbd-sep">·</span>
    <span class="kbd">Enter</span> voir le projet
  </p>
</section>
