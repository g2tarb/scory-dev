<section class="tj-hero">
  <a href="/" data-route="/" class="tj-hero__back" aria-label="Retour au hub">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
    <span>Hub</span>
  </a>

  <div class="tj-hero__overlay"></div>

  <div class="tj-hero__center">
    <h1 class="tj-hero__title">
      DYG
      <span class="tj-hero__alpha" aria-label="alpha"><span>a</span><span>l</span><span>p</span><span>h</span><span>a</span></span>
    </h1>
    <p class="tj-hero__subtitle">Scan ton GitHub. Profile 8 axes. Trouve ta team.</p>
    <p class="tj-hero__desc">
      La plateforme pour devs autodidactes qui veulent un portfolio prouvable.
      Tape ton pseudo GitHub — tu auras ton scan complet sur DYG en 10 secondes.
    </p>

    <div class="tj-hero__scan" id="tj-scan">
      <div class="tj-hero__scan-row">
        <input
          type="text"
          class="tj-hero__input"
          id="hero-github-input"
          placeholder="ton-username-github"
          autocomplete="off"
          spellcheck="false"
          inputmode="text"
        />
        <button class="tj-hero__scan-btn" id="hero-scan-btn" type="button">Scanner</button>
      </div>
      <span class="tj-hero__free-badge">100 % gratuit</span>
      <p class="tj-hero__error" id="hero-scan-error" style="display:none;"></p>
      <div class="tj-hero__progress" id="hero-scan-progress" style="display:none;">
        <div class="tj-hero__bar"><div class="tj-hero__bar-fill" id="hero-scan-bar"></div></div>
        <p class="tj-hero__step" id="hero-scan-step"></p>
      </div>
    </div>
  </div>
</section>
