<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#07060a" />
    <meta name="color-scheme" content="dark" />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="description" content="SCORY — Hub interactif. Selection de rubrique style character select : Projets, Devis, Apprentissage (DYG), Moi, RDV 10 min." />
    <meta name="author" content="Scory" />
    <meta name="robots" content="index, follow" />
    <title>SCORY — Hub</title>

    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect fill='%2307060a' width='32' height='32' rx='6'/%3E%3Ctext x='50%25' y='50%25' dominant-baseline='central' text-anchor='middle' fill='%23c9a962' font-family='serif' font-size='20' font-weight='600'%3ES%3C/text%3E%3C/svg%3E" />

    <!-- Fonts DYG : Bebas Neue (display condensé uppercase) + Inter (body) + JetBrains Mono (kicker/num) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />

    <link rel="stylesheet" href="./hub.css" />
  </head>
  <body>
    <!-- Canvas orbes archetypes DYG : 8 orbes orbitent en arriere-plan -->
    <canvas id="page-orbs" class="page-orbs" aria-hidden="true"></canvas>

    <!-- Canvas billes DYG concentrees : remplace le cercle accent quand on
         arrive sur la rubrique 03 Apprentissage. Opacity 0 par defaut. -->
    <canvas id="dyg-bubbles" class="dyg-bubbles" aria-hidden="true"></canvas>

    <!-- Bruit ambiant : grille de fond + scanlines (style DYG dark grid) -->
    <div class="bg-grid" aria-hidden="true"></div>
    <div class="bg-scanlines" aria-hidden="true"></div>
    <div class="bg-vignette" aria-hidden="true"></div>

    <!-- Branding fixe en haut -->
    <header class="brand" aria-label="Marque SCORY">
      <span class="brand__mark">S</span>
      <span class="brand__name">SCORY</span>
      <span class="brand__sub">Creative Dev — Paris</span>
    </header>

    <!-- App root : remplace par le router. Contient le hub par defaut. -->
    <main id="app-root" class="app-root" aria-live="polite">
      <!-- Le hub est injecté par hub.js au chargement -->
    </main>


    <!-- Mention legales / version : discret -->
    <footer class="brand-footer" aria-label="Pied de page">
      <span class="brand-footer__copy">&copy; 2026 Scory</span>
      <span class="brand-footer__sep">/</span>
      <span class="brand-footer__version">Hub v0.1</span>
    </footer>

    <!-- Hint molette/clavier : visible 6s puis fade -->
    <div class="kbd-hint" id="kbd-hint" aria-hidden="true">
      <span class="kbd">↕</span>
      <span>molette / drag pour tourner</span>
      <span class="kbd-sep">·</span>
      <span class="kbd">Enter</span>
      <span>pour entrer</span>
    </div>

    <!-- JS : module unique entry point -->
    <script type="module" src="./hub.js"></script>

    <!-- Fallback no-JS -->
    <noscript>
      <div style="padding:3rem;text-align:center;color:#c9a962;font-family:serif;">
        <h1 style="font-size:2.5rem;margin-bottom:1rem;">SCORY</h1>
        <p>Ce portfolio interactif nécessite JavaScript.</p>
        <p style="margin-top:1rem;"><a href="mailto:contact@scory.fr" style="color:#c9a962;">contact@scory.fr</a></p>
      </div>
    </noscript>
  </body>
</html>
