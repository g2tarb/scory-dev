<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#07060a" />
    <meta name="color-scheme" content="dark" />
    <meta name="robots" content="noindex, nofollow" />
    <title>SCORY — Brain Test</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect fill='%2307060a' width='32' height='32' rx='6'/%3E%3Ctext x='50%25' y='50%25' dominant-baseline='central' text-anchor='middle' fill='%23c9a962' font-family='serif' font-size='20' font-weight='600'%3ES%3C/text%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://unpkg.com" />
    <link rel="preconnect" href="https://www.gstatic.com" />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=DM+Sans:wght@400;600&display=swap" rel="stylesheet" />
    <style>
      *, *::before, *::after { box-sizing: border-box; }
      html, body {
        margin: 0; padding: 0;
        width: 100%; height: 100%;
        background: #07060a;
        color: rgba(245, 242, 255, 0.92);
        font-family: 'DM Sans', system-ui, sans-serif;
        overflow: hidden;
      }
      #brain-host {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      .hud {
        position: fixed;
        top: 24px;
        left: 24px;
        z-index: 10;
        max-width: 320px;
        padding: 18px 22px;
        background: rgba(20, 18, 28, 0.55);
        border: 1px solid rgba(201, 169, 98, 0.18);
        border-radius: 14px;
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        pointer-events: none;
      }
      .hud__kicker {
        display: block;
        margin: 0 0 6px;
        font-size: 0.7rem;
        text-transform: uppercase;
        letter-spacing: 0.18em;
        color: #c9a962;
        opacity: 0.8;
      }
      .hud__title {
        margin: 0 0 10px;
        font-family: 'Cormorant Garamond', serif;
        font-size: 1.5rem;
        font-weight: 600;
        color: #c9a962;
        letter-spacing: 0.04em;
      }
      .hud__hint {
        margin: 0;
        font-size: 0.85rem;
        line-height: 1.5;
        color: rgba(245, 242, 255, 0.7);
      }
      .hud__hint b {
        color: #c9a962;
        font-weight: 600;
      }
      .status {
        position: fixed;
        bottom: 24px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 10;
        padding: 8px 16px;
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 0.16em;
        color: rgba(245, 242, 255, 0.5);
        background: rgba(20, 18, 28, 0.55);
        border: 1px solid rgba(201, 169, 98, 0.12);
        border-radius: 999px;
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        pointer-events: none;
      }
      .status__dot {
        display: inline-block;
        width: 6px; height: 6px;
        margin-right: 8px;
        border-radius: 50%;
        background: #c9a962;
        box-shadow: 0 0 8px rgba(201, 169, 98, 0.6);
        vertical-align: middle;
      }
      .loading {
        position: fixed;
        inset: 0;
        z-index: 5;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #07060a;
        font-family: 'Cormorant Garamond', serif;
        font-size: 1.5rem;
        letter-spacing: 0.12em;
        color: #c9a962;
        opacity: 1;
        transition: opacity 0.6s ease;
      }
      .loading.is-hidden {
        opacity: 0;
        pointer-events: none;
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <div class="loading" id="loading">CHARGEMENT…</div>

    <aside class="hud">
      <span class="hud__kicker">Brain test</span>
      <h1 class="hud__title">Easter egg</h1>
      <p class="hud__hint">
        Glissez pour faire tourner le cerveau.<br />
        Tournez <b>très vite</b> pour déclencher l'explosion.
      </p>
    </aside>

    <div class="status">
      <span class="status__dot"></span>
      <span id="status-text">Initialisation</span>
    </div>

    <main id="brain-host" aria-label="Cerveau interactif"></main>

    <script type="module">
      import { BrainScene } from "./brain-scene.js";

      const host = document.getElementById("brain-host");
      const loading = document.getElementById("loading");
      const statusText = document.getElementById("status-text");

      const brainScene = new BrainScene(host, {
        glbUrl: "./brain.glb",
        onReady: ({ brain }) => {
          loading.classList.add("is-hidden");
          statusText.textContent = "Prêt — tourne vite pour exploser";
          // Expose pour debug console
          window.__brain = brain;
          window.__scene = brainScene;
        },
      });

      // Cleanup propre
      window.addEventListener("beforeunload", () => brainScene.dispose());
    </script>
  </body>
</html>
